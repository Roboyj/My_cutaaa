<title>Lilium Orientalis — 3D Botanical Reconstruction</title>
<style>html,body{margin:0;height:100%;background:#0e0c10;overflow:hidden}
canvas{display:block;margin:0 auto;height:100vh;max-width:100vw;aspect-ratio:9/16;object-fit:contain}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,DUR=13,HOLD=1.5,Q=0.5; // Q = mesh density (1 = full Python density, slower)
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const PI=Math.PI,sin=Math.sin,cos=Math.cos,sqrt=Math.sqrt,abs=Math.abs,max=Math.max,min=Math.min;
const cl=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const ss=(a,b,x)=>{const t=cl((x-a)/max(1e-8,b-a));return t*t*(3-2*t)};
const sss=(a,b,x)=>{const t=cl((x-a)/max(1e-8,b-a));return t*t*t*(t*(t*6-15)+10)};
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const nrm=a=>{const l=max(1e-8,sqrt(dot(a,a)));return [a[0]/l,a[1]/l,a[2]/l]};
const mm=(A,B)=>A.map((r,i)=>[0,1,2].map(j=>r[0]*B[0][j]+r[1]*B[1][j]+r[2]*B[2][j]));
const mv=(M,p)=>[M[0][0]*p[0]+M[0][1]*p[1]+M[0][2]*p[2],M[1][0]*p[0]+M[1][1]*p[1]+M[1][2]*p[2],M[2][0]*p[0]+M[2][1]*p[1]+M[2][2]*p[2]];
const rotX=a=>{const c=cos(a),s=sin(a);return [[1,0,0],[0,c,-s],[0,s,c]]};
const rotY=a=>{const c=cos(a),s=sin(a);return [[c,0,s],[0,1,0],[-s,0,c]]};
const basisFrom=d=>{let y=nrm(d),up=[0,1,0];if(abs(dot(y,up))>.95)up=[0,0,1];const x=nrm(crs(up,y)),z=nrm(crs(x,y));return [[x[0],y[0],z[0]],[x[1],y[1],z[1]],[x[2],y[2],z[2]]]};
function bez(p0,p1,p2,p3,u){const o=1-u;return[0,1,2].map(k=>o*o*o*p0[k]+3*o*o*u*p1[k]+3*o*u*u*p2[k]+u*u*u*p3[k])}
function bezT(p0,p1,p2,p3,u){const o=1-u;return nrm([0,1,2].map(k=>3*o*o*(p1[k]-p0[k])+6*o*u*(p2[k]-p1[k])+3*u*u*(p3[k]-p2[k])))}
function bishop(T){let t0=T[0],ref=abs(t0[2])>.9?[1,0,0]:[0,0,1],n1=nrm(crs(t0,ref)),n2=crs(t0,n1);const o=[[n1,n2]];
 for(let i=1;i<T.length;i++){const t=T[i];let p=sub(n1,mul(t,dot(n1,t)));if(dot(p,p)<1e-12)p=crs(t,n2);n1=nrm(p);n2=crs(t,n1);o.push([n1,n2])}return o}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- element ----------
function mk(kind,Nu,Nv,fn,cfn,o){ // fn(u,v)->[x,y,z] ; cfn(u,v,i,j)->[r,g,b]
 const P=new Float32Array(Nu*Nv*3),C=new Float32Array(Nu*Nv*3);
 for(let i=0;i<Nu;i++)for(let j=0;j<Nv;j++){const u=i/(Nu-1),v=-1+2*j/(Nv-1),k=(i*Nv+j)*3,p=fn(u,v,i,j),c=cfn(u,v,i,j);
  P[k]=p[0];P[k+1]=p[1];P[k+2]=p[2];C[k]=cl(c[0]);C[k+1]=cl(c[1]);C[k+2]=cl(c[2])}
 const nq=(Nu-1)*(Nv-1),eu=new Float32Array(nq),Cq=new Float32Array(nq*3);
 for(let i=0;i<Nu-1;i++)for(let j=0;j<Nv-1;j++){const q=i*(Nv-1)+j,u=(i+.5)/(Nu-1),va=(abs(-1+2*j/(Nv-1))+abs(-1+2*(j+1)/(Nv-1)))/2;eu[q]=.85*u+.15*va;
  for(let c=0;c<3;c++)Cq[q*3+c]=(C[(i*Nv+j)*3+c]+C[((i+1)*Nv+j)*3+c]+C[((i+1)*Nv+j+1)*3+c]+C[(i*Nv+j+1)*3+c])/4}
 return Object.assign({kind,Nu,Nv,P,Pc:null,eu,Cq,sss:.3,spec:.25,shin:18,wc:[.95,.78,.55],wsu:4,wsv:3,petal:false,pap:[],sx:new Float32Array(Nu*Nv),sy:new Float32Array(Nu*Nv),sz:new Float32Array(Nu*Nv),PP:new Float32Array(Nu*Nv*3)},o)}
const sc=(a,b,m)=>[0,1,2].map(k=>a[k]*(1-m)+b[k]*m);

function tube(p0,p1,p2,p3,rb,rt,Nu,Nv,cb,ct,o){const T=[],Ps=[];for(let i=0;i<Nu;i++){const u=i/(Nu-1);T.push(bezT(p0,p1,p2,p3,u));Ps.push(bez(p0,p1,p2,p3,u))}
 const F=bishop(T);
 const el=mk('stem',Nu,Nv,(u,v,i)=>{const th=(v+1)*PI;let r=rb*(1-u)+rt*u;if(u>.9)r*=1+.25*ss(.9,1,u);r*=1+.025*cos(6*th);
  const[n1,n2]=F[i];return add(Ps[i],add(mul(n1,r*cos(th)),mul(n2,r*sin(th))))},
  (u,v)=>mul(sc(cb,ct,u),.95+.05*cos(6*(v+1)*PI)),Object.assign({sss:.22,wc:[.38,.88,.5],wsu:6,wsv:4},o));
 el.pos=Ps;el.tan=T;return el}

function leaf(origin,az,len,wid,arch,tw,o){const R=rotY(az),Nu=36,Nv=17,cD=[.08,.27,.12],cM=[.16,.45,.19],cV=[.36,.65,.3],cT=[.24,.5,.18];
 return mk('leaf',Nu,Nv,(U,V)=>{const w=wid*(max(0,sin(PI*U**.66))**.92)*(1-.12*U)+.1*wid*(1-U)**3,reach=len*(.9*U+.1*sin(.5*PI*U)),elev=len*(.46*U-arch*U**2.1),
   fold=.055*wid*abs(V)**1.35*(1-.45*U)-.025*wid*V**4,ta=tw*U**1.35,x=w*V*cos(ta)-fold*sin(ta),z=elev+w*V*sin(ta)+fold*cos(ta);
   return add(origin,mv(R,[x,z,reach]))},
  (U,V)=>{const eg=abs(V)**1.4,mr=Math.exp(-((V/.1)**2)),pv=(.5+.5*cos(V*8*PI))**4;let c=sc(cM,cD,eg);c=sc(c,cT,.32*U*U);c=sc(c,cV,.48*mr);return c.map((x,k)=>x+.06*pv*cV[k])},
  Object.assign({sss:.3,spec:.35,shin:24,wc:[.45,.92,.54],wsu:7,wsv:4},o))}

function tepal(center,B,az,inner,scale,open,variant,o,seed){
 const r=rng(seed),Nu=max(12,Math.round(84*Q)),Nv=max(9,Math.round(41*Q)|1),wmax=(inner?.46:.39)*scale,len=(inner?1.26:1.24)*scale;
 const wp=U=>wmax*max(0,sin(PI*U**.58))**.72*(1-.12*U**3)+.055*scale*(1-U)**2.6;
 function surf(of){const tb=inner?.18:.3,tf=(inner?.74:.88)*of+.14,tr=(inner?1.55:1.72)*of**1.18,ds=len/(Nu-1),rm=[],ym=[],an=[];
  for(let i=0;i<Nu;i++){const u=i/(Nu-1);an.push(tb+tf*ss(.04,.58,u)+(tr-tf)*ss(.42,1,u)**1.25)}
  rm[0]=(inner?.036:.078)*scale;ym[0]=(inner?.035:0)*scale;
  for(let i=1;i<Nu;i++){const a=.5*(an[i-1]+an[i]);rm[i]=rm[i-1]+ds*sin(a);ym[i]=ym[i-1]+ds*cos(a)}
  const ca=cos(az),sa=sin(az);
  return(U,V,i)=>{const A=an[i],or=cos(A),oy=-sin(A),fur=.028*scale*Math.exp(-((V/.16)**2))*(1-.6*U),rf=.045*scale*V*V*ss(.35,.9,U),
   ra=(inner?.044:.028)*scale*of,re=max(0,sin(PI*U))*ss(.15,.88,U)*abs(V)**2.3,ruf=ra*re*sin(6*PI*U+(inner?.85:-.75)*Math.sign(V)),d=fur+rf+ruf,
   wr=rm[i]+.16*scale,phi=wp(U)*V/wr,cb=1-.55*ss(.35,.85,U),pe=phi*cb,xp=wp(U)*V*(1-cb),
   rs=wr*cos(pe)-.16*scale+d*or,xs=wr*sin(pe)+xp,y=ym[i]+d*oy;
   return add(center,mv(B,[xs*ca+rs*sa,y,-xs*sa+rs*ca]))}}
 const f1=surf(open),f2=surf(max(.28,open*.45));
 const cN=[.38,.68,.18],cI=[.99,.97,.96];let cD,cBl,pc,pr;
 if(variant=='stargazer'){cD=[.74,.08,.31];cBl=[.93,.38,.58];pc='rgb(92,8,30)';pr='rgb(155,22,72)'}
 else if(variant=='soft_rose'){cD=[.82,.18,.42];cBl=[.95,.54,.69];pc='rgb(112,14,42)';pr='rgb(178,38,95)'}
 else{cD=[.85,.28,.48];cBl=[.96,.66,.77];pc='rgb(125,20,52)';pr='rgb(190,52,110)'}
 const el=mk('petal',Nu,Nv,f1,(U,V)=>{let C=cI;const fm=ss(.05,.2,U)*(1-ss(.48,.86,U))*(1-ss(.32,.78,abs(V))),
   cm=ss(.07,.18,U)*(1-ss(.38,.74,U))*Math.exp(-((V/.4)**2));C=sc(C,cBl,fm);C=sc(C,cD,.85*cm);
   const nm=(1-ss(.04,.24,U))*Math.exp(-((V/(.36-.18*U))**2));C=sc(C,cN,.9*nm);
   const mv_=ss(.14,.28,U)*(1-ss(.58,.92,U))*Math.exp(-((V/.058)**2)),cmr=[0,1,2].map(k=>.78*cD[k]+.22*cI[k]);C=sc(C,cmr,.7*mv_);
   const vr=.5+.5*cos(V*18*PI),vs=.045*(1-nm)*ss(.08,.88,U);return[C[0]-vs*(1-vr)*.05,C[1]-vs*(1-vr)*.11,C[2]-vs*(1-vr)*.07]},
  Object.assign({sss:.46,spec:.26,shin:22,wc:[1,.72,.84],wsu:10,wsv:5,petal:true},o));
 const Pc=new Float32Array(el.P.length);for(let i=0;i<Nu;i++)for(let j=0;j<Nv;j++){const p=f2(i/(Nu-1),-1+2*j/(Nv-1),i),k=(i*Nv+j)*3;Pc[k]=p[0];Pc[k+1]=p[1];Pc[k+2]=p[2]}
 el.Pc=Pc;const np=inner?68:46;
 for(let n=0;n<np;n++){const pu=.15+.47*r(),side=r()<.5?-1:1,pv=side*(.07+.55*r()),ui=cl(Math.round(pu*(Nu-1)),1,Nu-2),vi=cl(Math.round((pv+1)*.5*(Nv-1)),1,Nv-2);
  el.pap.push([ui,vi,(1.6+1.3*r())*scale*(Q<1?1.15:1),pc,pr,.85*pu+.15*abs(pv)])}
 return el}

function stamens(center,B,scale,o){const out=[],st=o.st;
 const p0=[0,0,0],p1=mul([.02,.36,.03],scale),p2=mul([.04,.72,.07],scale),p3=mul([.02,1.02,.14],scale),Nu=28,T=[],Ps=[];
 for(let i=0;i<Nu;i++){T.push(bezT(p0,p1,p2,p3,i/(Nu-1)));Ps.push(bez(p0,p1,p2,p3,i/(Nu-1)))}const F=bishop(T);
 out.push(mk('pistil',Nu,13,(u,v,i)=>{const th=(v+1)*PI,tc=u>.92?sin(PI*u)**.22:1,br=scale*.02*(1-.2*u);let r=br;
   if(u>.84)r=(br+scale*.022*sin(PI*(u-.84)/.16)*(1+.45*cos(3*th)))*tc;const[n1,n2]=F[i];
   return add(center,mv(B,add(Ps[i],add(mul(n1,r*cos(th)),mul(n2,r*sin(th))))))},
  u=>sc([.52,.76,.3],[.62,.18,.35],ss(.82,.92,u)),Object.assign({sss:.3,spec:.38,shin:28,wc:[.75,.95,.55],wsu:6,wsv:4},{w0:o.w0,w1:o.w1,s0:o.s0,s1:o.s1})));
 for(let k=0;k<6;k++){const az=k*PI/3+.26,ca=cos(az),sa=sin(az),fl=(.27+.03*(k%2))*scale,ht=(.88+.04*(k%3))*scale,
  f0=[.028*scale*ca,.02*scale,.028*scale*sa],f1=[.075*scale*ca,.34*scale,.075*scale*sa],f2=[.195*scale*ca,.68*scale,.195*scale*sa],f3=[fl*ca,ht,fl*sa],d=.06*k,Nf=22,Tf=[],Pf=[];
  for(let i=0;i<Nf;i++){Tf.push(bezT(f0,f1,f2,f3,i/(Nf-1)));Pf.push(bez(f0,f1,f2,f3,i/(Nf-1)))}const Ff=bishop(Tf);
  out.push(mk('filament',Nf,8,(u,v,i)=>{const th=(v+1)*PI,rf=scale*.012*(1-.45*u),[n1,n2]=Ff[i];return add(center,mv(B,add(Pf[i],add(mul(n1,rf*cos(th)),mul(n2,rf*sin(th))))))},
   u=>sc([.56,.8,.36],[.98,.95,.96],ss(.15,.75,u)),{sss:.35,w0:o.w0+d,w1:o.w1+d*.5,s0:o.s0+d,s1:o.s1+d*.5,wc:[.95,.9,.65],wsu:5,wsv:3}));
  const al=.145*scale,rd=[ca,0,sa],td=[-sa,0,ca],ax=nrm(add(add(mul(td,.75),[0,.35,0]),mul(rd,.25))),a1=nrm(crs(ax,rd)),a2=nrm(crs(ax,a1));
  out.push(mk('anther',14,10,(u,v)=>{const th=(v+1)*PI,env=max(0,sin(PI*u))**.6,ra=.023*scale*env*(1+.28*cos(2*th));
    return add(center,mv(B,add(add(f3,mul(ax,(u-.5)*al)),add(mul(a1,ra*cos(th)),mul(a2,ra*sin(th))))))},
   (u,v)=>{const g=.5+.5*sin(19*u+7*(v+1)*PI);return sc([.76,.3,.07],[.94,.58,.14],.45*g)},
   {sss:.22,spec:.15,shin:10,w0:o.w0+.25+d,w1:o.w1+.2+d*.5,s0:o.s0+.25+d,s1:o.s1+d*.5,wc:[1,.75,.25],wsu:4,wsv:3}))}
 return out}

function bud(center,B,scale,crack,o){return mk('bud',34,21,(U,V)=>{const th=(V+1)*PI,rp=.21*scale*(max(0,sin(PI*U**.66))**1.12)*(1-.12*U)+.028*scale*(1-U)**2,
  R=rp*(1+.08*cos(3*th)*max(0,sin(PI*U)));return add(center,mv(B,[R*cos(th),.9*scale*U,R*sin(th)]))},
  (U,V)=>{const th=(V+1)*PI;let rm=ss(.24,.68,U)*(1-.45*(.5+.5*cos(3*th)));if(!crack)rm*=.45;let c=sc([.34,.62,.22],[.86,.34,.54],rm);return sc(c,[.96,.92,.9],ss(.78,.98,U))},
  Object.assign({sss:.34,spec:.3,shin:22,wc:[.68,.92,.58],wsu:6,wsv:4},o))}

// ---------- scene ----------
function buildScene(){const E=[],cb=[.13,.35,.15],ct=[.32,.58,.24],A=a=>a;
 const stems=[[[.03,-2.55,.02],[.09,-1.35,.06],[.14,-.35,.04],[.1,.34,.1],.048,.034,0,1.3,.3,2],[[-.06,-2.55,-.04],[-.14,-1.25,-.05],[-.18,-.1,-.02],[-.14,.82,-.04],.046,.032,.15,1.5,.45,2.2],[[0,-2.55,-.08],[-.04,-1.4,-.1],[.02,-.2,-.09],[.03,1.28,-.1],.042,.027,.25,1.7,.6,2.4]];
 const sp=[];for(const s of stems){const e=tube(s[0],s[1],s[2],s[3],s[4],s[5],Math.round(38*Q+10),13,cb,ct,{w0:s[6],w1:s[7],s0:s[8],s1:s[9]});E.push(e);sp.push(e)}
 const ped=[[[.12,.08,.07],[.19,.2,.15],[.24,.29,.23],[.27,.36,.3],.03,.025,.85,1.9,1.2,2.4],[[-.15,.52,-.03],[-.23,.68,.04],[-.29,.8,.1],[-.34,.9,.15],.028,.024,1,2.1,1.35,2.55],[[-.14,-.45,-.04],[-.25,-.34,.05],[-.33,-.25,.12],[-.38,-.18,.18],.027,.023,1.1,2.2,1.45,2.65],[[.02,1.12,-.09],[.05,1.3,-.06],[.07,1.46,-.04],[.08,1.6,-.02],.025,.021,1.25,2.3,1.6,2.75],[[.1,.34,.1],[.28,.66,.02],[.42,.94,-.04],[.5,1.16,-.08],.025,.021,1.3,2.35,1.65,2.8]];
 for(const s of ped)E.push(tube(s[0],s[1],s[2],s[3],s[4],s[5],22,11,cb,ct,{w0:s[6],w1:s[7],s0:s[8],s1:s[9]}));
 const nl=Q<1?.5:1,lv=[[0,5,.45,.92,.17,.35,.2,0],[0,9,2.35,1,.18,.36,-.16,.12],[0,14,-1.15,1.04,.19,.33,.22,.24],[0,19,.85,.94,.17,.3,-.18,.36],[0,24,-.55,.84,.16,.27,.14,.48],[0,30,1.65,.74,.14,.24,-.14,.6],[1,7,-2.25,.94,.17,.35,-.2,.1],[1,12,3.05,1.02,.18,.34,.16,.22],[1,17,-1.65,.98,.18,.32,-.22,.34],[1,23,2.25,.88,.16,.29,.18,.46],[1,29,-2.55,.78,.15,.25,-.15,.58],[2,10,-.25,.88,.16,.34,.15,.2],[2,16,1.25,.92,.17,.31,-.18,.35],[2,22,-2.85,.82,.15,.28,.16,.5],[2,28,.55,.72,.13,.24,-.12,.65]];
 for(const[si,ui,az,l,w,ar,tw,d]of lv){const pos=sp[si].pos;const idx=Math.round(ui/37*(pos.length-1));E.push(leaf(pos[idx],az,l,w,ar,tw,{w0:.75+d,w1:2.1+d,s0:1.35+d,s1:3.15+d}))}
 const fl=[{c:[.27,.36,.3],d:[.22,.5,.84],s:.9,o:1,v:'stargazer',r:.22,w:[2,4.8],f:[4.2,7.8],m:[7,9.4],sd:100},{c:[-.34,.9,.15],d:[-.24,.58,.78],s:.84,o:.95,v:'soft_rose',r:.75,w:[2.4,5.2],f:[4.6,8.2],m:[7.3,9.7],sd:200},{c:[-.38,-.18,.18],d:[-.3,.46,.83],s:.76,o:.82,v:'blush_ivory',r:-.32,w:[2.8,5.5],f:[5,8.5],m:[7.6,9.9],sd:300}];
 for(const f of fl){const B=basisFrom(f.d);
  for(let k=0;k<3;k++){const d=.12*k;E.push(tepal(f.c,B,f.r+k*2*PI/3,false,f.s,f.o,f.v,{w0:f.w[0]+d,w1:f.w[1]+d,s0:f.f[0]+d,s1:f.f[1]+d},f.sd+k))}
  for(let k=0;k<3;k++){const d=.18+.12*k;E.push(tepal(f.c,B,f.r+(k+.5)*2*PI/3,true,f.s,f.o,f.v,{w0:f.w[0]+d,w1:f.w[1]+d,s0:f.f[0]+d,s1:f.f[1]+d},f.sd+10+k))}
  E.push(...stamens(f.c,B,f.s,{w0:f.m[0],w1:f.m[0]+1.3,s0:f.m[0]+.4,s1:f.m[1],st:0}))}
 E.push(bud([.08,1.6,-.02],basisFrom([.06,.95,.16]),.8,true,{w0:2.5,w1:4.8,s0:4.5,s1:7.5}));
 E.push(bud([.5,1.16,-.08],basisFrom([.36,.9,.12]),.74,false,{w0:2.7,w1:5,s0:4.7,s1:7.7}));
 return E}
const ELS=buildScene();

// ---------- backdrop ----------
const bg=document.createElement('canvas');bg.width=W;bg.height=H;{const b=bg.getContext('2d'),im=b.createImageData(W,H),d=im.data;
 for(let j=0;j<H;j++){const y=-1+2*j/(H-1);for(let i=0;i<W;i++){const x=-1+2*i/(W-1),g=Math.exp(-1.55*((x*.95)**2+((y+.08)*.75)**2)),uw=Math.exp(-2.2*((x-.15)**2+(y+.32)**2)),k=(j*W+i)*4;
  d[k]=16+26*g+22*uw;d[k+1]=12+22*g+10*uw;d[k+2]=14+24*g+12*uw;d[k+3]=255}}b.putImageData(im,0,0)}

// ---------- shading ----------
const LK=nrm([-.42,.62,.66]),LF=nrm([.65,-.2,.73]),HK=nrm([LK[0],LK[1],LK[2]+1]);
function light(nx,ny,nz,c0,c1,c2,s,sp,sh,out){if(nz<0){nx=-nx;ny=-ny;nz=-nz}
 const dk=cl((nx*LK[0]+ny*LK[1]+nz*LK[2]+.25)/1.25),df=cl((nx*LF[0]+ny*LF[1]+nz*LF[2]+.4)/1.4),fr=(1-cl(nz))**2.2,
  bt=cl(-(nx*LK[0]+ny*LK[1]+nz*LK[2])*.6+.45),ssv=s*(.55*fr+.45*bt),spv=sp*cl(nx*HK[0]+ny*HK[1]+nz*HK[2])**sh;
 let v=c0*(.24+.72*dk*1.04+.22*df*.78)+c0*ssv*1.05+spv;v=cl(v,0,1.35);out[0]=cl(v/(1+.18*v)*1.14)*255|0;
 v=c1*(.24+.72*dk*1.01+.22*df*.86)+c1*ssv*.82+spv*.98;v=cl(v,0,1.35);out[1]=cl(v/(1+.18*v)*1.14)*255|0;
